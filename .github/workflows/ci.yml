name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Fetch verified external tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --repo '${{ github.repository }}' --pattern Arkive-Tools-win-x64.zip --dir $env:RUNNER_TEMP
          ./eng/Get-ExternalTools.ps1 -Archive "$env:RUNNER_TEMP/Arkive-Tools-win-x64.zip"
      - name: Build native Crunch bridge
        shell: pwsh
        run: ./tools/Build-CrunchNative.ps1 -PlatformToolset v143
      - name: Restore, build, and run smoke tests
        shell: pwsh
        run: ./eng/Verify-Arkive.ps1 -Configuration Release -RequireExternalCrunch
