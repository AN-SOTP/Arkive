<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arkive 3D map</title>
  <link rel="stylesheet" href="map.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hint">Drag to turn · right-drag or Shift-drag to move · wheel to zoom · click a piece to select it · F frames the selection</div>
  <div id="status">Loading the map…</div>
  <div id="options">
    <label title="The map's busy areas: raid gates often have several arenas, apart">Go to <select id="arenaSelect"></select></label>
    <label title="Look at the arena from the game's own camera angle, cutting away what stands above the camera"><input type="checkbox" id="gameCheck" checked /> Game camera</label>
    <label title="The game's sun, fog and colour grading for each part of the map; Plain light shows the textures as they are">Lighting <select id="environmentSelect"></select></label>
    <label title="The light the game bakes into the map's static pieces: shade, bounced light and lamps"><input type="checkbox" id="bakedCheck" checked /> Baked lighting</label>
    <label><input type="checkbox" id="skyCheck" checked /> Show sky and backdrops</label>
    <label><input type="checkbox" id="effectCheck" /> Show glows, water and effects</label>
    <label><input type="checkbox" id="cutsceneCheck" /> Show cutscene sets</label>
  </div>
  <!-- The page's address carries map.js's version, so a cached older copy is never used after an update. -->
  <script type="module">import(`./map.js${location.search}`);</script>
</body>
</html>
