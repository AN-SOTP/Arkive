<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arkive model viewer</title>
  <link rel="stylesheet" href="viewer.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <header id="toolbar">
    <div class="group">
      <label class="field">LOD <select id="lodSelect" title="Cycle LODs (L)"></select></label>
      <label class="field">UV <select id="uvSelect" title="Cycle UV sets (Ctrl+U)"></select></label>
      <label class="field">Colours
        <select id="shadingSelect" title="Game shader runs each material's own compiled shader from the game; colour recipes are Arkive's per-family approximations; stored textures show textures as stored, like UModel (C)">
          <option value="game">Game shader</option>
          <option value="recipe">Colour recipes</option>
          <option value="stored">Stored textures</option>
          <option value="materialIds">Material IDs</option>
          <option value="vertexColors">Vertex colours</option>
          <option value="clay">Clay</option>
        </select>
      </label>
    </div>
    <div class="group toggles">
      <button data-toggle="wireframe" title="Wireframe (W)">Wireframe</button>
      <button data-toggle="normals" title="Show normals (N)">Normals</button>
      <button data-toggle="tangents" title="Show tangents (T)">Tangents</button>
      <button data-toggle="skeleton" title="Show skeleton (B)">Skeleton</button>
      <button data-toggle="boneNames" title="Show bone names (Ctrl+B)">Bone names</button>
      <button data-toggle="sockets" title="Show attach sockets (S)">Sockets</button>
      <button data-toggle="uvs" title="Show mesh UVs (U)">UVs</button>
      <button data-toggle="grid" title="Grid (G)">Grid</button>
      <button data-toggle="backfaces" title="Show back faces of one-sided materials">Back faces</button>
    </div>
    <div class="group">
      <label class="field">Light
        <select id="lightSelect" title="Lighting (Ctrl+L)">
          <option value="studio">Studio</option>
          <option value="headlight">Headlight</option>
          <option value="flat">Unlit</option>
        </select>
      </label>
      <button id="editsToggle" aria-pressed="true" hidden title="Show your mod's working files (edited mesh, textures and material values) or the original game asset (E)">Your edits</button>
      <button id="focusButton" title="Focus camera on mesh (F)">Focus</button>
      <button id="screenshotButton" title="Save screenshot (Ctrl+S); Alt+S keeps a transparent background">Screenshot</button>
      <button id="bakeButton" title="Save each material's colours, as shown, as textures laid out on UV set 0 (for Blender or reference)">Export colours</button>
      <button id="umodelButton" title="Open the same object in UModel">Open in UModel</button>
    </div>
    <div class="group" id="animationGroup" hidden>
      <label class="field">Animation <select id="animationSelect" title="Play one of this character's own game animations, to check clipping in motion"><option value="">Rest pose</option></select></label>
      <button id="animationPlay" title="Pause or play the animation">Pause</button>
      <label class="field">Speed <select id="animationSpeed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
      <span id="animationStatus" class="muted"></span>
    </div>
  </header>
  <main>
    <aside id="panel">
      <nav class="tabs">
        <button data-tab="proportions" hidden>Proportions</button>
        <button data-tab="info" class="active">Info</button>
        <button data-tab="materials">Materials</button>
        <button data-tab="textures">Textures</button>
        <button data-tab="properties">Properties</button>
      </nav>
      <section id="tab-proportions" class="tab"></section>
      <section id="tab-info" class="tab active"></section>
      <section id="tab-materials" class="tab"></section>
      <section id="tab-textures" class="tab"></section>
      <section id="tab-properties" class="tab">
        <input id="propertySearch" type="search" placeholder="Filter UModel properties">
        <pre id="propertyText"></pre>
      </section>
    </aside>
    <div id="stage">
      <canvas id="view3d"></canvas>
      <canvas id="overlay2d"></canvas>
      <div id="texturePane" hidden>
        <div class="textureBar">
          <span id="textureTitle"></span>
          <span class="channels">
            <button data-channel="rgb" class="active">RGB</button>
            <button data-channel="r">R</button>
            <button data-channel="g">G</button>
            <button data-channel="b">B</button>
            <button data-channel="a">A</button>
            <button data-channel="rgba">RGBA</button>
          </span>
          <button id="textureClose" title="Back to the model (Esc)">Close</button>
        </div>
        <canvas id="textureCanvas"></canvas>
      </div>
      <div id="hud"></div>
      <div id="loading">Loading…</div>
    </div>
  </main>
  <footer id="statusbar"></footer>
  <script type="module" src="viewer.js"></script>
</body>
</html>
